<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .Main_Box {
        background-color: lightblue;
        height: 500px;
        display: flex;
        gap: 10px;

        justify-content: center;
        justify-content: end;
        justify-content: start;
        justify-content: space-around;
        justify-content: space-between;
        justify-content: space-evenly;

        align-items: center;
        align-items: end;
        align-items: start;

        flex-direction: column;
        flex-direction: column-reverse;
        flex-direction: row;
        flex-direction: row-reverse;

        flex-wrap: wrap;
      }
      .box {
        width: 100px;
        height: 100px;
        background-color: red;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="Main_Box">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>
  </body>
</html>
